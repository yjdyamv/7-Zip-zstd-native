name: Build native 7-Zip ZS

# Builds native 7zz binaries from the newest mcmilk/7-Zip-zstd tag and
# publishes them as a GitHub Release with the SAME tag name. Manual runs can
# pin a specific tag and overwrite an existing release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (default: newest tag)'
        required: false
      publish:
        description: 'Create/update a GitHub Release with the assets'
        type: boolean
        default: false
      overwrite:
        description: 'Replace assets of an existing release with the same tag'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: build-native
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve upstream tag and commit
        id: resolve
        run: |
          UPSTREAM="mcmilk/7-Zip-zstd"
          TAG=""
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            # Accept both "v26.02-v1.5.7-R2" and "refs/tags/v26.02-v1.5.7-R2".
            TAG="${TAG#refs/tags/}"
          fi
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            # Pick the newest tag by version instead of trusting
            # releases/latest: the "latest" release may point at an older tag.
            TAG=$(gh api "repos/$UPSTREAM/tags" --paginate -q '.[].name' \
              | sort -V \
              | tail -1)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::could not resolve upstream tag"
            exit 1
          fi
          # Peel annotated tags to the commit SHA so the checkout stays pinned
          # even if the tag is moved or recreated later.
          REF=$(gh api "repos/$UPSTREAM/git/ref/tags/$TAG" 2>/dev/null) || {
            echo "::error::upstream tag '$TAG' not found in $UPSTREAM (expected e.g. v26.02-v1.5.7-R2)"
            exit 1
          }
          if [ "$(printf '%s' "$REF" | jq -r '.object.type')" = "tag" ]; then
            TAG_OBJ=$(printf '%s' "$REF" | jq -r '.object.sha')
            SHA=$(gh api "repos/$UPSTREAM/git/tags/$TAG_OBJ" -q '.object.sha')
          else
            SHA=$(printf '%s' "$REF" | jq -r '.object.sha')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building tag: $TAG (commit: $SHA)"

  build:
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux ships a single fully-static musl build per arch: it runs on
          # both glibc and musl (Alpine) hosts. The glibc-linked variants are
          # deliberately not built — linked on ubuntu-latest (glibc 2.39) they
          # would only run on the newest distros, a strictly worse trade.
          - name: linux-x64
            os: ubuntu-latest
            artifact: 7zz-linux-x64
            pkg: tar.gz
            outdir: _o
            libc: musl
          - name: linux-arm64
            os: ubuntu-24.04-arm
            artifact: 7zz-linux-arm64
            pkg: tar.gz
            outdir: _o
            libc: musl
          - name: macos-arm64
            os: macos-26
            artifact: 7zz-macos-arm64
            pkg: tar.gz
            outdir: _o
          # Intel macOS: GitHub's macOS runners are Apple Silicon only, so
          # the x86_64 binary is cross-compiled (clang -arch x86_64) on the
          # same macos-26 runner.
          - name: macos-x64
            os: macos-26
            artifact: 7zz-macos-x64
            pkg: tar.gz
            outdir: _o
            arch: x86_64
          - name: windows-x64
            os: windows-latest
            artifact: 7zz-windows-x64
            pkg: zip
            outdir: x64
            arch: x64
          - name: windows-arm64
            os: windows-11-arm
            artifact: 7zz-windows-arm64
            pkg: zip
            outdir: arm64
            arch: arm64
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v7
        with:
          repository: mcmilk/7-Zip-zstd
          ref: ${{ needs.resolve.outputs.commit }}
          path: src-7zip

      - name: Build (Windows, MSVC nmake)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR echo ::error::Visual Studio not found
          if not defined VSDIR exit /b 1
          call "%VSDIR%/VC/Auxiliary/Build/vcvarsall.bat" ${{ matrix.arch }}
          if errorlevel 1 exit /b 1
          cd src-7zip/CPP/7zip/Bundles/Alone2
          nmake -nologo -f makefile PLATFORM=${{ matrix.arch }}
          if errorlevel 1 exit /b 1

      - name: Build (macOS)
        if: runner.os == 'macOS' && matrix.libc != 'musl'
        run: |
          cd src-7zip/CPP/7zip/Bundles/Alone2
          # Cross-compile Intel (x86_64) on the Apple Silicon runner when
          # matrix.arch is set; clang's -arch selects the target slice.
          ARCH_FLAGS=""
          if [ -n "${{ matrix.arch }}" ]; then
            ARCH_FLAGS="-arch ${{ matrix.arch }}"
          fi
          make -j2 -f makefile.gcc \
            CC="clang $ARCH_FLAGS" \
            CXX="clang++ $ARCH_FLAGS" \
            CFLAGS_WARN_WALL="-Wall -Wextra"

      - name: Verify macOS binary
        if: runner.os == 'macOS' && matrix.libc != 'musl'
        run: |
          set -e
          BIN=src-7zip/CPP/7zip/Bundles/Alone2/_o/7zz
          file "$BIN"
          if [ -n "${{ matrix.arch }}" ]; then
            file "$BIN" | grep -q "x86_64" || {
              echo "::error::expected x86_64 binary"; exit 1; }
          fi
          if "$BIN" i >/dev/null 2>&1; then
            echo "OK: macOS 7zz"
          elif [ -n "${{ matrix.arch }}" ]; then
            # Running the Intel build needs Rosetta 2, which may be absent.
            echo "::warning::cross-built 7zz did not run here (Rosetta 2 unavailable?); architecture checked above"
          else
            echo "::error::7zz failed to run"; exit 1
          fi

      # Native musl build: g++ in an Alpine container links against musl
      # libc. LDFLAGS_STATIC_2=-static (command line wins over the makefile's
      # empty default) produces a fully static binary that also runs on
      # glibc hosts. The whole source tree is mounted (makefile.gcc includes
      # ../Format7zF/Arc_gcc.mak and ../../7zip_gcc.mak above Alone2); the
      # _o output lands back in the mounted tree for the Package step.
      - name: Build (Linux, musl-static via Alpine)
        if: matrix.libc == 'musl'
        run: |
          cd src-7zip
          docker run --rm -v "$PWD":/build \
            -w /build/CPP/7zip/Bundles/Alone2 alpine:3.24 \
            sh -c "apk add --no-cache build-base && \
                   make -j2 -f makefile.gcc \
                     CFLAGS_WARN_WALL='-Wall -Wextra' \
                     LDFLAGS_STATIC_2=-static"

      - name: Verify musl-static binary
        if: matrix.libc == 'musl'
        run: |
          BIN=src-7zip/CPP/7zip/Bundles/Alone2/_o/7zz
          file "$BIN"
          # Accept both "statically linked" and "static-pie linked" (gcc 15 /
          # alpine 3.24 emits static-PIE by default) — any "dynamically
          # linked" output means the -static override failed.
          if file "$BIN" | grep -q "dynamically linked"; then
            echo "::error::musl 7zz is not statically linked"
            exit 1
          fi
          # Smoke test: a static musl binary executes on this glibc host.
          "$BIN" i >/dev/null || { echo "::error::7zz failed to run"; exit 1; }
          echo "OK: musl-static 7zz"

      - name: Package
        shell: bash
        run: |
          set -e
          PKG_DIR="$RUNNER_TEMP/pkg"
          mkdir -p "$PKG_DIR"
          cp "src-7zip/CPP/7zip/Bundles/Alone2/${{ matrix.outdir }}/7zz"* "$PKG_DIR/" 2>/dev/null || true
          cp src-7zip/COPYING "$PKG_DIR/LICENSE" 2>/dev/null || true
          {
            echo "tag=${{ needs.resolve.outputs.tag }}"
            echo "upstream_commit=${{ needs.resolve.outputs.commit }}"
            echo "build_repo_commit=$GITHUB_SHA"
          } > "$PKG_DIR/VERSION"
          cd "$PKG_DIR"
          if [ "${{ matrix.pkg }}" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$PKG_DIR/*' -DestinationPath '$RUNNER_TEMP/${{ matrix.artifact }}.zip' -Force"
          else
            tar -czf "$RUNNER_TEMP/${{ matrix.artifact }}.tar.gz" ./*
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/${{ matrix.artifact }}.*
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          COMMIT="${{ needs.resolve.outputs.commit }}"
          NOTES="7-Zip ZS $TAG native binaries built from upstream commit $COMMIT
          (https://github.com/mcmilk/7-Zip-zstd/commit/$COMMIT).

          - Linux x64 / arm64 (7zz) — fully static musl build, runs on both
            glibc and musl (Alpine) hosts
          - macOS arm64 / x64 (7zz)
          - Windows x64 / arm64 (7zz.exe)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ github.event.inputs.overwrite }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
              gh release upload "$TAG" dist/*.zip dist/*.tar.gz --clobber
              gh release edit "$TAG" --title "7-Zip ZS $TAG (native)" --notes "$NOTES"
            else
              echo "release $TAG already exists; set overwrite=true to replace assets"
            fi
          else
            gh release create "$TAG" dist/*.zip dist/*.tar.gz \
              --title "7-Zip ZS $TAG (native)" \
              --notes "$NOTES"
          fi

  # Publish the assembled binaries to npm as the single package `7zip-zstd-native`.
  # Uses npm Trusted Publishing (OIDC): no long-lived token, and provenance
  # attestations are generated automatically. Configure the trusted publisher
  # for the `7zip-zstd-native` package on npmjs.com with this workflow filename.
  npm:
    needs: [resolve, build]
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout this repo (package.json, index.js, cli.js)
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Assemble bin/
        shell: bash
        run: |
          set -e
          mkdir -p bin/linux-x64 bin/linux-arm64 bin/darwin-arm64 \
                   bin/darwin-x64 bin/win32-x64 bin/win32-arm64
          # Linux uses the musl-static build only: it runs on both glibc and
          # musl hosts, so a single binary per arch covers every Linux target.
          tar -xzf dist/7zz-linux-x64.tar.gz   -C bin/linux-x64     ./7zz
          tar -xzf dist/7zz-linux-arm64.tar.gz -C bin/linux-arm64   ./7zz
          tar -xzf dist/7zz-macos-arm64.tar.gz -C bin/darwin-arm64  ./7zz
          tar -xzf dist/7zz-macos-x64.tar.gz   -C bin/darwin-x64    ./7zz
          unzip -j -o dist/7zz-windows-x64.zip   7zz.exe -d bin/win32-x64
          unzip -j -o dist/7zz-windows-arm64.zip 7zz.exe -d bin/win32-arm64
          chmod 0755 bin/linux-*/7zz bin/darwin-*/7zz
          # Hoist the upstream LGPL license (shipped as LICENSE in each
          # archive) to the package root as COPYING, without clobbering the
          # wrapper's own MIT LICENSE.
          tar -xzOf dist/7zz-linux-x64.tar.gz ./LICENSE > COPYING
          ls -lR bin COPYING

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # The npm version is derived from the upstream tag — `<7-Zip major>.<minor>`
      # plus a per-line publish counter, clamped above whatever is already
      # published (scripts/ci/npm-version-from-tag.sh). Upstream's exact
      # identity goes into the `7zip` field, never into the version number.
      - name: Compute npm version
        id: npmver
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          versions=$(mktemp)
          err=$(mktemp)
          if ! npm view "$name" versions --json >"$versions" 2>"$err"; then
            # Only "this package does not exist yet" may be read as "no
            # versions": a network or auth failure must not become a first
            # publish.
            grep -q 'E404' "$err" || {
              echo "::error::could not list published versions of $name"
              cat "$err"
              exit 1
            }
            : >"$versions"
          fi
          rm -f "$err"
          version=$(bash scripts/ci/npm-version-from-tag.sh "$TAG" "$versions")
          rm -f "$versions"
          [ -n "$version" ] || {
            echo "::error::could not derive a version from tag $TAG"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm version: $version (from $TAG)"

      - name: Stamp package metadata
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          VERSION: ${{ steps.npmver.outputs.version }}
          BUILD_REPO_COMMIT: ${{ github.sha }}
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tag = process.env.TAG;
            const revision = (tag.match(/-R([0-9]+)$/) || [])[1] || "0";
            const zstd = (tag.match(/-v([0-9][0-9.]*)-R[0-9]+$/) || [])[1] || "unknown";
            p.version = process.env.VERSION;
            p["7zip"] = {
              upstreamTag: tag,
              upstreamCommit: process.env.COMMIT,
              revision: Number(revision),
              zstd: zstd,
              buildRepoCommit: process.env.BUILD_REPO_COMMIT,
            };
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '

      - name: Publish to npm (skip if already published)
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; nothing to do"
            exit 0
          fi
          echo "Publishing $name@$version"
          npm publish --provenance
